<!DOCTYPE html>
<!--

  |  HANGAR ALA                                                      |
  |  Progettista di strutture alari per la stampa 3D                 |
  |                                                                  |
  |  Progetto e sviluppo:  prof. ing. B. Raucci                      |
  |  Costruzioni Aeronautiche - ITIS "E. Majorana"                   |
  +------------------------------------------------------------------+
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangar Ala · prof. ing. B. Raucci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Hangar Ala - tavolo da disegno tecnico: carta fredda, inchiostro blu notte,
   arancio aeronautico per le centine, blu acciaio per i longheroni.
   Impianto: parametri a sinistra, vista al centro, riepilogo a destra. */
:root {
  --carta: #e9edf1;
  --foglio: #f8fafb;
  --inchiostro: #15212d;
  --tenue: #586675;
  --linea: #cbd3db;
  --accento: #cf4a12;
  --acciaio: #24618f;
  --bene: #1d7a4c;
  --attenzione: #96590a;
  --errore: #b3261e;
  --velo: rgba(21, 33, 45, .06);
  --f-titoli: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-testo: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-cifre: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0f161d; --foglio: #17202a; --inchiostro: #e4ebf2; --tenue: #93a2b1; --linea: #2a3744;
    --accento: #ff7b3d; --acciaio: #5eaae0; --bene: #4cc38a; --attenzione: #e0a243; --errore: #f2776d;
    --velo: rgba(228, 235, 242, .07); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0f161d; --foglio: #17202a; --inchiostro: #e4ebf2; --tenue: #93a2b1; --linea: #2a3744;
  --accento: #ff7b3d; --acciaio: #5eaae0; --bene: #4cc38a; --attenzione: #e0a243; --errore: #f2776d;
  --velo: rgba(228, 235, 242, .07); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--carta); color: var(--inchiostro); font: 14px/1.45 var(--f-testo); display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acciaio); outline-offset: 1px; }
h2, h3 { font-family: var(--f-titoli); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.cifre { font-family: var(--f-cifre); font-variant-numeric: tabular-nums; }

/* ---------- barra superiore */
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px 16px; background: var(--foglio); border-bottom: 1px solid var(--linea); }
.marca { display: flex; align-items: center; gap: 10px; }
.marca svg { width: 44px; height: 22px; color: var(--accento); flex: none; }
.marca b { font: 600 22px/1 var(--f-titoli); letter-spacing: .06em; text-transform: uppercase; }
.marca small { color: var(--tenue); font-size: 12px; }
.nome { flex: 1 1 220px; min-width: 0; background: transparent; border: 1px solid transparent; border-bottom-color: var(--linea); padding: 5px 6px; font-weight: 500; }
.nome:hover, .nome:focus { border-color: var(--linea); background: var(--carta); }
.azioni { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--linea); background: var(--foglio); padding: 6px 12px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--tenue); background: var(--velo); }
.btn.primario { background: var(--accento); border-color: var(--accento); color: #fff; font-weight: 600; }
.btn.primario:hover { filter: brightness(1.08); }
.btn.piccolo { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: default; }
select.btn { padding-right: 6px; max-width: 250px; }

/* ---------- banco di lavoro */
.banco { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr) 310px; grid-template-areas: "par vista riep"; }
.parametri { grid-area: par; overflow-y: auto; border-right: 1px solid var(--linea); background: var(--foglio); }
.riepilogo { grid-area: riep; overflow-y: auto; border-left: 1px solid var(--linea); background: var(--foglio); padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 16px; }
.vista { grid-area: vista; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

/* ---------- pannello dei parametri */
.gruppo { border-bottom: 1px solid var(--linea); }
.gruppo > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font: 600 15px/1.1 var(--f-titoli); letter-spacing: .06em; text-transform: uppercase; }
.gruppo > summary::-webkit-details-marker { display: none; }
.gruppo > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--tenue); border-bottom: 2px solid var(--tenue); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.gruppo[open] > summary::before { transform: rotate(45deg); }
.gruppo > summary .conta { margin-left: auto; font: 500 12px var(--f-cifre); color: var(--tenue); letter-spacing: 0; }
.corpo { padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.campo { display: grid; grid-template-columns: minmax(0, 1fr) 118px; align-items: center; gap: 8px; }
.campo > label { min-width: 0; }
.campo .sim { color: var(--tenue); font-family: var(--f-cifre); font-size: 12px; margin-left: 4px; }
.campo .nota, .nota { grid-column: 1 / -1; color: var(--tenue); font-size: 12px; margin: -3px 0 0; }
.ingresso { display: flex; align-items: stretch; border: 1px solid var(--linea); border-radius: 3px; background: var(--carta); min-width: 0; }
.ingresso input, .ingresso select { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; padding: 5px 6px; font-family: var(--f-cifre); font-size: 13px; text-align: right; }
.ingresso select, .ingresso input[type="text"] { text-align: left; font-family: var(--f-testo); }
.ingresso i { font-style: normal; color: var(--tenue); font-size: 12px; padding: 0 6px 0 2px; align-self: center; }
.ingresso:focus-within { border-color: var(--acciaio); }
.campo.largo { grid-template-columns: minmax(0, 1fr) 180px; }
.campo.derivato .ingresso { background: transparent; border-style: dashed; }
.campo.derivato input { color: var(--tenue); }
.blocco.pin { font: 500 10px var(--f-cifre); padding: 0 4px; margin-left: 4px; color: var(--acciaio); vertical-align: 1px; }
.spunta { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.spunta input { margin: 3px 0 0; accent-color: var(--accento); flex: none; }
.spunta small { display: block; color: var(--tenue); font-size: 12px; }
.blocco { border: 1px solid var(--linea); border-radius: 3px; padding: 0 5px; background: var(--foglio); cursor: pointer; font-size: 11.5px; color: var(--tenue); white-space: nowrap; }
.blocco[aria-pressed="true"] { background: var(--acciaio); border-color: var(--acciaio); color: #fff; }
.terna { display: flex; gap: 6px; }
.terna .btn { flex: 1; padding: 5px 4px; font-size: 12.5px; text-align: center; }
.terna .btn[aria-pressed="true"] { border-color: var(--acciaio); color: var(--acciaio); font-weight: 600; box-shadow: inset 0 -2px 0 var(--acciaio); }
.scheda-l { border: 1px solid var(--linea); border-left: 3px solid var(--acciaio); border-radius: 3px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; background: var(--carta); }
.scheda-l header { display: flex; align-items: center; gap: 8px; }
.scheda-l header b { font: 600 14px var(--f-titoli); letter-spacing: .05em; text-transform: uppercase; }
.scheda-l header .btn { margin-left: auto; }
.scheda-l .ingresso { background: var(--foglio); }
.schizzo { width: 46px; height: 46px; flex: none; color: var(--acciaio); }
textarea.script { width: 100%; min-height: 150px; resize: vertical; border: 1px solid var(--linea); border-radius: 3px; background: var(--carta); font: 11.5px/1.4 var(--f-cifre); padding: 6px; white-space: pre; }
details.sotto > summary { cursor: pointer; color: var(--acciaio); font-size: 13px; padding: 2px 0; }
details.sotto > div { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
.sorgente { margin: 12px 14px; border: 1px solid var(--acciaio); border-left-width: 3px; border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--carta); }
.sorgente b { overflow-wrap: anywhere; }

/* ---------- vista centrale */
.schede { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
.schede button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; font: 600 14.5px var(--f-titoli); letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); border-radius: 3px 3px 0 0; margin-bottom: -1px; }
.schede button[aria-selected="true"] { background: var(--carta); border-color: var(--linea); color: var(--inchiostro); box-shadow: inset 0 2px 0 var(--accento); }
.schede button[disabled] { opacity: .35; cursor: default; }
.strumenti { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; min-height: 44px; border-bottom: 1px solid var(--linea); font-size: 13px; }
.strumenti label { display: flex; align-items: center; gap: 6px; }
.strumenti input[type="range"] { width: min(260px, 40vw); accent-color: var(--accento); }
.strumenti select { border: 1px solid var(--linea); background: var(--foglio); border-radius: 3px; padding: 3px 6px; }
.strumenti .spazio { flex: 1; }
.tela { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
#tavola { position: absolute; inset: 0; overflow: auto; padding: 16px; display: none; }
#tavola .contorno { fill: var(--accento); fill-opacity: .18; stroke: var(--accento); stroke-width: 1.3; vector-effect: non-scaling-stroke; fill-rule: evenodd; stroke-linejoin: round; }
#tavola .longh { fill: var(--acciaio); fill-opacity: .28; stroke: var(--acciaio); stroke-width: 1.1; vector-effect: non-scaling-stroke; }
#tavola .longh.comm { stroke-dasharray: 5 3; fill-opacity: .1; }
#tavola .manic { fill: var(--bene); fill-opacity: .35; stroke: var(--bene); stroke-width: 1; vector-effect: non-scaling-stroke; }
#tavola .bordo { fill: none; stroke: var(--tenue); stroke-width: 1; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
#tavola .quota { fill: none; stroke: var(--inchiostro); stroke-width: .8; vector-effect: non-scaling-stroke; }
#tavola .freccia { fill: var(--inchiostro); }
#tavola .asse { fill: none; stroke: var(--tenue); stroke-width: .9; stroke-dasharray: 10 3 2 3; vector-effect: non-scaling-stroke; }
#tavola text { fill: var(--inchiostro); font-family: var(--f-cifre); }
#tavola text.titolo { font-family: var(--f-titoli); font-weight: 600; letter-spacing: .03em; }
#tavola svg { display: block; width: 100%; max-width: 1100px; height: auto; margin: 0 auto 18px; background: var(--foglio); border: 1px solid var(--linea); }
.legenda { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; background: var(--foglio); border: 1px solid var(--linea); border-radius: 3px; padding: 6px 10px; font-size: 12px; max-width: calc(100% - 24px); }
.legenda span { display: flex; align-items: center; gap: 5px; }
.legenda i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.guida { position: absolute; right: 12px; top: 10px; color: var(--tenue); font-size: 11.5px; text-align: right; pointer-events: none; }
.vuoto { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 24px; color: var(--tenue); }
.vuoto p { max-width: 46ch; margin: 0; }
.avanzamento { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: transparent; display: none; }
.avanzamento i { display: block; height: 100%; width: 0; background: var(--accento); transition: width .1s linear; }
.goccia { position: absolute; inset: 8px; border: 2px dashed var(--acciaio); border-radius: 6px; background: var(--velo); display: none; align-items: center; justify-content: center; font: 600 20px var(--f-titoli); letter-spacing: .06em; text-transform: uppercase; color: var(--acciaio); pointer-events: none; }
.tela.sopra .goccia { display: flex; }

/* ---------- riepilogo */
.riepilogo h3 { font-size: 14px; color: var(--tenue); margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; }
.riepilogo h3 small { margin-left: auto; font: 400 11.5px var(--f-testo); text-transform: none; letter-spacing: 0; }
.tessere { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: 3px; overflow: hidden; }
.tessere div { background: var(--foglio); padding: 7px 9px; min-width: 0; }
.tessere span { display: block; color: var(--tenue); font-size: 11.5px; }
.tessere b { font: 500 17px var(--f-cifre); font-variant-numeric: tabular-nums; }
.tessere b small { font-size: 11.5px; color: var(--tenue); font-weight: 400; }
table.dati { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.dati th { text-align: left; font-weight: 500; color: var(--tenue); font-size: 11.5px; padding: 2px 4px 4px 0; border-bottom: 1px solid var(--linea); }
table.dati td { padding: 4px 4px 4px 0; border-bottom: 1px solid var(--linea); vertical-align: top; overflow-wrap: anywhere; }
table.dati.chiavi td:first-child { white-space: nowrap; color: var(--tenue); }
table.dati td.n, table.dati th.n { text-align: right; font-family: var(--f-cifre); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; padding-left: 6px; }
.punto { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.avvisi { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.avvisi li { border-left: 3px solid var(--acciaio); background: var(--carta); padding: 6px 8px; font-size: 12.5px; border-radius: 0 3px 3px 0; }
.avvisi li b { font: 600 11px var(--f-titoli); letter-spacing: .08em; text-transform: uppercase; display: block; color: var(--acciaio); }
.avvisi li.attenzione { border-color: var(--attenzione); } .avvisi li.attenzione b { color: var(--attenzione); }
.avvisi li.errore { border-color: var(--errore); } .avvisi li.errore b { color: var(--errore); }
.avvisi li.bene { border-color: var(--bene); } .avvisi li.bene b { color: var(--bene); }
.pulsanti { display: flex; flex-wrap: wrap; gap: 6px; }
.pulsanti .btn { flex: 1 1 auto; text-align: center; }
.stato-g { font-size: 12.5px; color: var(--tenue); margin: 0 0 8px; }
.stato-g.vecchio { color: var(--attenzione); }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 20; width: min(560px, calc(100% - 32px)); pointer-events: none; }
#toast div { background: var(--inchiostro); color: var(--carta); padding: 9px 14px; border-radius: 3px; font-size: 13px; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); max-width: 100%; overflow-wrap: anywhere; }
#toast div.errore { background: var(--errore); color: #fff; }
[hidden] { display: none !important; }

/* ---------- larghezze ridotte */
@media (max-width: 1180px) {
  html, body { height: auto; }
  body { display: block; }
  .banco { grid-template-columns: 310px minmax(0, 1fr); grid-template-areas: "par vista" "par riep"; }
  .parametri { overflow: visible; }
  .riepilogo { border-left: 0; border-top: 1px solid var(--linea); overflow: visible; }
  .tela { flex: none; height: min(62vh, 560px); min-height: 380px; }
}
@media (max-width: 760px) {
  .banco { display: flex; flex-direction: column; }
  .vista { order: 1; } .parametri { order: 2; border-right: 0; border-top: 1px solid var(--linea); } .riepilogo { order: 3; }
  .tela { height: 400px; min-height: 0; }
  .guida { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.nota-profilo { margin: -2px 0 8px; }
#tavola .cartiglio rect { fill: none; stroke: var(--inchiostro); stroke-width: 1; vector-effect: non-scaling-stroke; }
#tavola .cartiglio path { fill: none; stroke: var(--inchiostro); stroke-width: .8; vector-effect: non-scaling-stroke; }
#tavola .cartiglio text { font-family: var(--f-cifre); }

/* ---- disegno 2D interattivo, piano in pianta, schizzo libero */
:root { --libero: #7a4fb5; }
:root[data-theme="dark"] { --libero: #b99af0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --libero: #b99af0; } }
#tavola.pieno { padding: 0; overflow: hidden; }
#tavola.pieno svg { width: 100%; height: 100%; max-width: none; margin: 0; border: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
#tavola .qm { fill: var(--acciaio); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }
#tavola .qm:hover, #tavola .qm:focus { fill: var(--accento); font-weight: 600; outline: none; }
#tavola .man { fill: var(--foglio); stroke: var(--accento); stroke-width: 2.2; vector-effect: non-scaling-stroke; cursor: grab; touch-action: none; }
#tavola .man:hover { fill: var(--accento); }
#tavola .media { fill: none; stroke: var(--acciaio); stroke-width: 1.1; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
#tavola .ko { fill: var(--errore); fill-opacity: .15; stroke: var(--errore); stroke-width: 2; vector-effect: non-scaling-stroke; }
.quota-inp { position: absolute; z-index: 6; width: 96px; height: 32px; font: 500 14px var(--f-cifre); text-align: center; border: 2px solid var(--accento); border-radius: 3px; background: var(--foglio); color: var(--inchiostro); box-shadow: 0 2px 10px rgba(0, 0, 0, .25); }
#tavola .letto { fill: var(--foglio); stroke: var(--inchiostro); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
#tavola .griglia { fill: none; stroke: var(--linea); stroke-width: .7; vector-effect: non-scaling-stroke; }
#tavola .griglia.forte { stroke: var(--tenue); stroke-opacity: .55; }
#tavola .utile { fill: none; stroke: var(--tenue); stroke-width: 1; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
#tavola .pezzo { cursor: grab; }
#tavola .pezzo .ing { fill: transparent; stroke: var(--tenue); stroke-width: .9; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
#tavola .pezzo .alone { fill: var(--tenue); fill-opacity: .14; }
#tavola .pezzo .sag { fill-opacity: .6; stroke: var(--inchiostro); stroke-width: .9; vector-effect: non-scaling-stroke; }
#tavola .pezzo text { pointer-events: none; font-weight: 600; }
#tavola .pezzo.sel .ing { stroke: var(--acciaio); stroke-width: 2.4; stroke-dasharray: none; }
#tavola .pezzo.urto .ing { stroke: var(--errore); stroke-width: 2.4; stroke-dasharray: none; fill: var(--errore); fill-opacity: .18; }
#tavola .q-pos { pointer-events: none; }
#tavola .asse-sk { fill: none; stroke: var(--acciaio); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
#tavola .sk-f { fill: transparent; stroke: var(--inchiostro); stroke-width: 1.3; vector-effect: non-scaling-stroke; cursor: move; }
#tavola .sk-f.m-foro { stroke: var(--errore); stroke-dasharray: 6 4; }
#tavola .sk-f.m-rilievo { stroke: var(--accento); }
#tavola .sk-f.m-incavo { stroke: var(--acciaio); stroke-dasharray: 3 3; }
#tavola .sk-f path { vector-effect: non-scaling-stroke; }
#tavola .sk-f .sk-hit { fill: transparent; stroke: none; }
#tavola .sk-ril { fill: var(--accento); fill-opacity: .55; }
#tavola .sk-inc { fill: var(--acciaio); fill-opacity: .4; }
#tavola .sk-box { fill: none; stroke: var(--acciaio); stroke-width: 1; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; pointer-events: none; }
#tavola .sk-anc { fill: var(--acciaio); pointer-events: none; }
#tavola .pezzo .sag.cima { fill: var(--inchiostro); fill-opacity: .55; stroke: none; }
.strumenti .riga-forma label.largo input { width: 220px; }
.vuoto > span { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
#tavola .sk-f.sel { stroke: var(--acciaio); stroke-width: 2.6; }
#tavola .sk-f.prev { stroke: var(--accento); stroke-width: 2; pointer-events: none; }
#tavola .sk-poli { fill: none; stroke: var(--accento); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
#tavola .sk-primo { fill: var(--accento); pointer-events: none; }
.segm { display: inline-flex; }
.segm .btn { border-radius: 0; margin-left: -1px; }
.segm .btn:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.segm .btn:last-child { border-radius: 0 3px 3px 0; }
.segm .btn[aria-pressed="true"] { background: var(--acciaio); border-color: var(--acciaio); color: #fff; }
.strumenti input[type="number"], .strumenti input[type="text"] { border: 1px solid var(--linea); background: var(--foglio); color: inherit; border-radius: 3px; padding: 3px 6px; font: inherit; }
.strumenti input.corto { width: 70px; font-family: var(--f-cifre); }
.strumenti input[type="text"] { width: 150px; }
.strumenti .suggerimento { color: var(--tenue); font-size: 12px; }
.strumenti .riga-forma { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex-basis: 100%; padding-top: 6px; border-top: 1px dashed var(--linea); }
.strumenti .pz-nome { font-weight: 600; }
.vuoto .btn { margin: 4px; }

/* ---- testata: tavola blu con la firma del progettista */
.testata {
  --t-fondo: #10233a; --t-carta: #e8f0f8; --t-tenue: #9db3c8; --t-arancio: #ff7b3d; --t-acciaio: #6fb6ea;
  position: relative; display: flex; align-items: center; gap: 18px 28px; padding: 12px 20px 13px; color: var(--t-carta);
  background-color: var(--t-fondo);
  background-image: linear-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .07) 1px, transparent 1px),
    linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
    radial-gradient(120% 140% at 50% 0%, #1a3654 0%, transparent 70%);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px, 100% 100%;
  border-bottom: 3px solid var(--t-arancio);
}
:root[data-theme="dark"] .testata { --t-fondo: #0a1826; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .testata { --t-fondo: #0a1826; } }
.t-marca { display: flex; align-items: center; gap: 12px; flex: none; min-width: 0; }
.t-marca svg { width: 58px; height: 29px; color: var(--t-arancio); flex: none; }
.t-marca h1 { margin: 0; font: 600 32px/0.95 var(--f-titoli); letter-spacing: .1em; text-transform: uppercase; color: #fff; }
.t-marca p { margin: 5px 0 0; font: 500 10.5px/1 var(--f-cifre); letter-spacing: .14em; text-transform: uppercase; color: var(--t-tenue); }
.t-volo { flex: 1 1 280px; min-width: 0; height: 80px; max-width: 600px; margin: -6px auto; overflow: visible; }
.t-volo .t-fl { fill: none; stroke: url(#t-sf); stroke-width: 1.1; stroke-dasharray: 24 12; animation: t-scorre 2.6s linear infinite; }
.t-volo .t-corda { fill: none; stroke: rgba(232, 240, 248, .35); stroke-width: .7; stroke-dasharray: 9 3 2 3; }
.t-volo .t-rib { fill: rgba(255, 123, 61, .3); stroke: var(--t-arancio); stroke-width: 1.2; stroke-linejoin: round; }
.t-volo .t-lon { fill: var(--t-acciaio); stroke: #d8ecfb; stroke-width: .5; }
.t-volo text { font: 500 8.5px var(--f-cifre); letter-spacing: .12em; text-transform: uppercase; fill: var(--t-tenue); paint-order: stroke; stroke: var(--t-fondo); stroke-width: 4px; stroke-linejoin: round; }
@keyframes t-scorre { to { stroke-dashoffset: -36; } }
.t-firma {
  position: relative; flex: none; display: grid; gap: 3px; padding: 7px 16px 8px 18px; margin-left: auto;
  border: 1px solid rgba(232, 240, 248, .45); border-left: 4px solid var(--t-arancio); background: rgba(255, 255, 255, .045);
}
.t-firma::before, .t-firma::after { content: ""; position: absolute; width: 9px; height: 9px; border: 1.5px solid var(--t-arancio); }
.t-firma::before { top: -5px; right: -5px; border-left: 0; border-bottom: 0; }
.t-firma::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }
.t-et { font: 500 9.5px/1 var(--f-cifre); letter-spacing: .22em; text-transform: uppercase; color: var(--t-arancio); }
.t-nome { font-family: var(--f-titoli); line-height: 1; white-space: nowrap; }
.t-nome .t-titolo { font-size: 21px; font-weight: 500; letter-spacing: .04em; color: var(--t-tenue); }
.t-nome b { font-size: 38px; font-weight: 600; letter-spacing: .05em; color: #fff; }
.t-ruolo { display: flex; gap: 0; font: 400 11px/1.2 var(--f-testo); color: var(--t-tenue); padding-top: 4px; border-top: 1px solid rgba(232, 240, 248, .22); }
.t-ruolo span + span::before { content: "·"; margin: 0 7px; color: var(--t-arancio); }
@media (prefers-reduced-motion: reduce) { .t-volo .t-fl { animation: none; } }
@media (max-width: 1100px) { .t-volo { flex-basis: 200px; } .t-marca h1 { font-size: 28px; } }
@media (max-width: 860px) { .t-volo { display: none; } }
@media (max-width: 600px) {
  .testata { flex-wrap: wrap; padding: 10px 14px 11px; gap: 10px; }
  .t-marca svg { width: 44px; height: 22px; }
  .t-marca { flex: 1 1 100%; }
  .t-marca h1 { font-size: 25px; }
  .t-marca p { font-size: 9px; letter-spacing: .08em; white-space: normal; line-height: 1.25; }
  .t-marca > div { min-width: 0; }
  .t-firma { margin-left: 0; width: 100%; padding: 6px 12px 7px 14px; }
  .t-nome .t-titolo { font-size: 17px; } .t-nome b { font-size: 30px; }
  .t-ruolo { flex-wrap: wrap; font-size: 10.5px; }
}

/* ---- correnti, gusci e scheda Misure */
:root { --corrente: #a3652a; --guscio: #3c9488; }
:root[data-theme="dark"] { --corrente: #dca15f; --guscio: #66c2b4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --corrente: #dca15f; --guscio: #66c2b4; } }
#tavola .pelle { fill: var(--guscio); fill-opacity: .55; stroke: var(--guscio); stroke-width: .8; vector-effect: non-scaling-stroke; }
#tavola .corr { fill: var(--corrente); stroke: var(--inchiostro); stroke-width: .6; vector-effect: non-scaling-stroke; }
#tavola .corr-l { fill: none; stroke: var(--corrente); stroke-width: 1.4; stroke-dasharray: 8 4; vector-effect: non-scaling-stroke; }
.livelli .btn { font-size: 13px; padding-left: 4px; padding-right: 4px; }
.largo-btn { width: 100%; margin-top: 4px; }
#tavola.misure { padding: 0; overflow: auto; background: var(--foglio); }
.mis { max-width: 1180px; margin: 0 auto; padding: 14px 18px 40px; font-size: 13.5px; }
.mis-intro { margin: 0 0 8px; line-height: 1.5; }
.catena { display: flex; flex-wrap: wrap; gap: 4px 0; margin: 0 0 14px; padding: 0; list-style: none; counter-reset: c; }
.catena li { display: flex; align-items: center; }
.catena li + li::before { content: "→"; margin: 0 6px; color: var(--tenue); }
.catena a { color: var(--acciaio); text-decoration: none; border-bottom: 1px dotted currentColor; font-weight: 500; }
.mis-effetti { border: 1px solid var(--accento); border-left-width: 4px; background: color-mix(in srgb, var(--accento) 8%, transparent); padding: 10px 14px; margin: 0 0 16px; }
.mis-effetti h3 { margin: 0 0 4px; font: 600 15px var(--f-titoli); letter-spacing: .04em; }
.mis-effetti p { margin: 0 0 6px; }
.mis-effetti ul { margin: 0; padding: 0; list-style: none; columns: 2 320px; column-gap: 24px; }
.mis-effetti li { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; border-bottom: 1px dashed var(--linea); break-inside: avoid; }
.mis-effetti li b { font-family: var(--f-cifre); font-weight: 500; white-space: nowrap; }
.mis-effetti li.diretta span::after { content: " (modificata da te)"; color: var(--accento); }
.mis-gruppo { margin: 0 0 18px; }
.mis-gruppo h3 { margin: 0 0 2px; font: 600 16px var(--f-titoli); letter-spacing: .05em; text-transform: uppercase; border-bottom: 2px solid var(--inchiostro); padding-bottom: 3px; }
.mis-gruppo > .nota { margin: 4px 0 6px; }
.mis-gruppo table { width: 100%; border-collapse: collapse; }
.mis-gruppo th { text-align: left; font: 500 10.5px var(--f-cifre); letter-spacing: .1em; text-transform: uppercase; color: var(--tenue); padding: 4px 6px; border-bottom: 1px solid var(--linea); }
.mis-gruppo td { padding: 4px 6px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.m-sim { width: 44px; font-family: var(--f-cifre); color: var(--acciaio); white-space: nowrap; }
.m-nome { width: 30%; }
.m-val { width: 120px; white-space: nowrap; }
.m-val b { font: 500 14px var(--f-cifre); }
.m-val input { width: 92px; font: 500 14px var(--f-cifre); padding: 3px 6px; border: 1px solid var(--linea); border-radius: 3px; background: var(--carta); color: var(--inchiostro); }
.t-guida .m-val input { border-color: var(--acciaio); }
.t-fissa .m-val input { border-color: var(--accento); border-width: 2px; }
.m-um { width: 36px; color: var(--tenue); font-family: var(--f-cifre); font-size: 12px; }
.m-ruolo { width: 86px; }
.m-regola { color: var(--inchiostro); font-size: 12.5px; line-height: 1.35; }
.m-calc { display: block; font-family: var(--f-cifre); font-size: 12px; color: var(--tenue); }
.era { display: block; font: 400 11px var(--f-cifre); color: var(--accento); }
tr.cambiata td { background: color-mix(in srgb, var(--accento) 12%, transparent); }
.bd { display: inline-block; font: 500 10.5px/1 var(--f-cifre); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; background: transparent; white-space: nowrap; }
button.bd { cursor: pointer; }
.bd.r-guida { color: var(--acciaio); }
.bd.r-auto { color: var(--tenue); }
.bd.r-fissa { color: var(--accento); background: color-mix(in srgb, var(--accento) 12%, transparent); }
.bd.r-calc { color: var(--tenue); border-style: dashed; }
.compat td.n { font-family: var(--f-cifre); text-align: right; }
.compat tr.ko td { color: var(--errore); font-weight: 600; }
.barra-uso { display: inline-block; width: 90px; height: 7px; background: var(--linea); vertical-align: middle; margin-right: 4px; }
.barra-uso i { display: block; height: 100%; background: var(--bene); }
.compat tr.ko .barra-uso i { background: var(--errore); }
.ef-breve ul { margin: 4px 0 6px; padding-left: 18px; font-size: 12.5px; }
.ef-breve p { margin: 0; }
@media (max-width: 760px) { .m-regola { display: none; } .m-nome { width: auto; } .mis { padding: 10px; } }

</style>

// ---------------------------------------------------------------- struttura dell'ala
function sedeLongherone(sez, gioco, du, dv) {

/* Assi dei longheroni: rettilinei per i centri delle sedi di radice ed estremita'. */

// ---------------------------------------------------------------- schizzi 2D da estrudere
// ---------------------------------------------------------------- scritte vettoriali
/* I contorni dei caratteri arrivano da caratteri.js (G.CARATTERI): per ogni

const CAR_PREDEFINITO = 'lato-black';

    if (l.sez.tonda && sp.stampa) avv('info', 'Longherone ' + (l.i + 1) + ': sezione tonda stampata coricata con una spianatura di appoggio larga ' + arr(0.4 * l.sez.H, 10) + ' mm.');

    cma: (2 / 3) * cr * (1 + (ct / cr) + (ct / cr) * (ct / cr)) / (1 + ct / cr),
    yA, yB, rid, livello: P.livello, correnti, gusci,
    centine, longheroni, schizzi, parti, avvisi, errori: avvisi.filter(a => a.liv === 'errore').length
  };
}

    if (an) {
      tre.gruppo = gruppoGcode(an); tre.scena.add(tre.gruppo);
      inquadra(tre.gruppo, -Math.PI / 2, 0.95, stato.P.stampante.lx + '_' + stato.P.stampante.ly + (stato.est ? stato.est.nome : ''));
      const N = an.strati.length; stato.opz.strato = A.limita(stato.opz.strato, 0, N - 1);
      s = (stato.est ? '' : selPiatto) + '<label>Strato <input type="range" id="op-strato" min="0" max="' + (N - 1) + '" value="' + stato.opz.strato + '"></label><span id="et-strato" class="cifre"></span>' +
        '<label><input type="checkbox" id="op-solo"' + (stato.opz.solo ? ' checked' : '') + '> Solo questo strato</label><button class="btn piccolo" data-az="inquadra">Inquadra</button>';
      const usati = new Set(); an.strati.forEach(L => { for (let i = 0; i < L.tipi.length; i += 7) usati.add(L.tipi[i]); });
      l = A.TIPI.map((t, i) => (usati.has(i) ? '<span><i style="background:' + COL_TIPI[i] + '"></i>' + t + '</span>' : '')).join('');
    } else msg = stato.generato ? 'Il progetto è cambiato dopo l’ultima generazione.' : 'Il G-code non è ancora stato generato.';
  }
  str.innerHTML = s; leg.innerHTML = l; leg.style.display = l ? '' : 'none';
  vuoto.style.display = msg ? 'flex' : 'none';
  if (msg) { vuoto.innerHTML = '<p>' + esc(msg) + '</p>' + (v === 'gcode' && tre.ok ? '<button class="btn primario" data-az="genera">Genera il G-code</button>' : '') + (v === 'schizzo' ? '<span><button class="btn primario" data-az="sk-nuovo">Nuovo pezzo</button><button class="btn" data-az="sk-centina">Parti dal contorno della centina</button></span><span>' +
      ESEMPI_SK.map(q => '<button class="btn" data-az="sk-esempio" data-e="' + q[0] + '">' + q[1] + '</button>').join('') + '</span>' : ''); cv.style.display = 'none'; tav.style.display = 'none'; }
  if (v === 'gcode') applicaStrato();
  rendi();
}

// ---------------------------------------------------------------- avvio
function avvia() {
  let P = null;
  try { const s = localStorage.getItem(CHIAVE_LOCALE); if (s) P = A.normalizzaProgetto(JSON.parse(s)); } catch (err) { P = null; }
  stato.P = P || daModello(0);
  $('#modelli').innerHTML = '<option value="">Modelli pronti…</option>' + MODELLI.map((m, i) => '<option value="' + i + '">' + esc(m[0]) + '</option>').join('');
  inizia3D(); eventiModulo(); eventiCad(); eventiMisure();
  $('#modelli').addEventListener('change', ev => { if (ev.target.value === '') return; stato.P = daModello(+ev.target.value); stato.est = null; stato.gcode = []; stato.generato = false; stato.centina = 0; tre.inq = {}; azzeraCad(); ev.target.value = ''; aggiorna('nessuna', true); });
  $('#nome-progetto').addEventListener('input', ev => { if (stato.est) return; stato.P.nome = ev.target.value || 'Ala'; stato.valido = false; try { localStorage.setItem(CHIAVE_LOCALE, JSON.stringify(stato.P)); } catch (err) { /* facoltativo */ } });
  $('#nome-progetto').addEventListener('change', () => disegnaRiepilogo());
  $('#btn-apri').addEventListener('click', () => $('#file').click());
  $('#file').addEventListener('change', ev => { const f = ev.target.files[0]; ev.target.value = ''; if (f) apriFile(f); });
  $('#btn-kit').addEventListener('click', () => scaricaKit());
  $('.schede').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (!b || b.disabled) return; stato.vista = b.dataset.v; disegnaVista(); });
  document.addEventListener('click', ev => {
    const b = ev.target.closest('.vista [data-az], .riepilogo [data-az]'); if (!b) return;
    const az = b.dataset.az;
    if (az === 'genera') generaTutto().then(ok => { if (ok) { stato.vista = 'gcode'; disegnaVista(); } });
    else if (az === 'inquadra') { delete tre.cam[stato.vista]; tre.inq[stato.vista] = null; disegnaVista(); }
    else if (az === 'vedi3d') { stato.vista = 'assieme'; disegnaVista(); }
    else if (az === 'vedi-misure') { stato.vista = 'misure'; disegnaVista(); }
    else if (az === 'm-sblocca') { const P = stato.P; P.man = {}; P.longheroni.forEach(sp => { sp.man = {}; }); stato.scrollMisure = $('#tavola').scrollTop; aggiorna('auto', true); }
    else if (/^p-/.test(az)) azionePiano(az);
    else if (az === 'sk-esempio') azioneSchizzo(az, b.dataset.e);
    else if (/^sk-/.test(az)) azioneSchizzo(az, b);
    else if (az === 's-gcode') salvaSingolo('gcode'); else if (az === 's-3mf') salvaSingolo('3mf'); else if (az === 's-json') salvaSingolo('json');
  });
  $('.strumenti').addEventListener('input', ev => {
    const el = ev.target;
    if (el.dataset.b === 'f-txt') { const f = skCorrente() && skCorrente().forme[stato.sk.sel]; if (f) { f.testo = el.value.replace(/[\u0000-\u001f\u007f]/g, ' ').slice(0, 80) || 'Testo'; ridisegnaSchizzo(); } return; }
    if (el.id === 'op-strato') { stato.opz.strato = +el.value; applicaStrato(); }
    else if (el.id === 'op-solo') { stato.opz.solo = el.checked; applicaStrato(); }
    else if (el.id === 'op-riv') { stato.opz.rivestimento = el.checked; disegnaVista(); }
  });
  $('.strumenti').addEventListener('change', ev => {
    const el = ev.target;
    const kb = el.dataset.b;
    if (kb === 't-centina') { const v = parseFloat(el.value); if (isFinite(v)) { stato.P.spCentina = A.limita(v, 1.5, 20); fissa('spCentina', true); aggiorna('spCentina', true); } }
    else if (kb && /^pz-/.test(kb)) azionePiano(kb, el.value);
    else if (kb) campoSchizzo(kb, el);
    else if (el.id === 'sel-centina') { stato.centina = +el.value; disegnaVista(); }
    else if (el.id === 'm-auto' || el.id === 'm-adatta') { stato.P[el.id === 'm-auto' ? 'auto' : 'adatta'] = el.checked; stato.scrollMisure = $('#tavola').scrollTop; aggiorna(el.id === 'm-auto' ? 'auto' : 'adatta', true); }
    else if (el.id === 'op-spacc') { stato.opz.spaccato = el.checked; disegnaVista(); }
    else if (el.id === 'sel-piatto') { stato.piatto = +el.value; stato.opz.strato = 1e9; disegnaVista(); disegnaRiepilogo(); }
  });
  const tela = $('.tela');
  ['dragenter', 'dragover'].forEach(n => tela.addEventListener(n, ev => { ev.preventDefault(); tela.classList.add('sopra'); }));
  ['dragleave', 'drop'].forEach(n => tela.addEventListener(n, ev => { ev.preventDefault(); if (n === 'drop' || ev.target === tela) tela.classList.remove('sopra'); }));
  tela.addEventListener('drop', ev => { const f = ev.dataTransfer && ev.dataTransfer.files[0]; if (f) apriFile(f); });
  const ritema = () => { if (stato.P) disegnaVista(); };
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ritema);
  new MutationObserver(ritema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  aggiorna('', true);
  if (!stato.M) { stato.P = daModello(0); aggiorna('', true); } // progetto memorizzato non piu' valido
}
window.HangarAla = { stato, apriFile, generaTutto, disposizione, aggiorna };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', avvia); else avvia();
})();

</script>
